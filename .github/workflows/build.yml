name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: |
          cd /tmp
          mkdir -p gradle-gen && cd gradle-gen
          echo 'rootProject.name = "temp"' > settings.gradle
          gradle wrapper --gradle-version 9.5.1
          cd "$GITHUB_WORKSPACE"
          mkdir -p gradle/wrapper
          cp /tmp/gradle-gen/gradlew /tmp/gradle-gen/gradlew.bat .
          cp /tmp/gradle-gen/gradle/wrapper/gradle-wrapper.jar /tmp/gradle-gen/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew
          rm -rf /tmp/gradle-gen

      - name: Update version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG_VERSION" >> $GITHUB_OUTPUT
          VERSION="${TAG_VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 计算 versionCode
          IFS='.' read -ra PARTS <<< "$VERSION"
          VERSION_CODE=0
          for i in "${!PARTS[@]}"; do
            MULT=$((10 ** (6 - i * 3)))
            VERSION_CODE=$((VERSION_CODE + PARTS[i] * MULT))
          done

          # 更新 build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts

          echo "Updated to $TAG_VERSION (versionCode: $VERSION_CODE)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ls -la release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Sign APK
        run: |
          # 用 build-tools 的 apksigner 对 unsigned APK 做 v2+v3 签名
          BUILDTOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED="release/Mirage-v${{ steps.version.outputs.version }}-release.apk"
          mkdir -p release
          "$BUILDTOOLS/zipalign" -f 4 "$UNSIGNED" release/aligned.apk
          "$BUILDTOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            release/aligned.apk
          "$BUILDTOOLS/apksigner" verify --print-certs "$SIGNED" | head -5

      - name: Clean keystore
        if: always()
        run: rm -f release.keystore release/aligned.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mirage ${{ steps.version.outputs.tag }}
          body: |
            ## Mirage ${{ steps.version.outputs.version }}

            ### 功能
            - 好友隐身（不删不屏蔽，主页/聊天/联系人/朋友圈/搜索/群成员全场景隐藏）
            - 主页伪装（伪装成另一位好友）
            - 语音/视频通话拦截、通知拦截
            - 消息防撤回、密友消息提示
            - 朋友圈去广告
            - 指令系统（#mirage wxid 添加 / #unmirage 移除 / #munhide 临时显示 / #mhide 恢复 / #mlist 列表）
            - 长按空白处呼出、备份/恢复

            ### 安装
            - 需要 Xposed 框架 (LSPosed / LSPatch)
            - 下载 APK 安装后，在 Xposed 管理器中启用模块，作用域勾选微信
            - 强制停止微信后重新打开生效

            ### 变更
            详见 [CHANGELOG.md](CHANGELOG.md)
          files: release/*.apk
          draft: false
          prerelease: false